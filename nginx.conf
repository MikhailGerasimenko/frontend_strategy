server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  index index.html;

  # SPA: все клиентские маршруты → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # кэш статики сборки Vite
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
  }
}
