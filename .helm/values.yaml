rbac:

  # -- Enable role-based access control. If true, role & rolebinding will be created
  enabled: false
  serviceAccount:

    # -- Create service account. If true, role will be binded to this SA. If false, role will be binded to default SA
    create: false

    ## -- Name of SA
    name: serviceaccount

    ## - SA additional labels
    additionalLabels: {}
      # key: value

    ## - SA annotations
    annotations: {}
      # key: value

  ## -- Create role with rules
  role: {}
    # rules:
    # - apiGroups:
    #   - ""
    #   resources:
    #   - configmaps
    #   verbs:
    #   - get

pdb:

  # -- Enable pod disruption budget. Works on Kubernetes >= v1.23
  enabled: false

  # -- Pod disruption budget configuration
  minAvailable: 1
