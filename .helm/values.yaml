  #     mountPath: /mnt/mydata

  # -- Default duration in seconds Kubernetes waits for container to exit before sending kill signal
  terminationGracePeriodSeconds: 60

service:

  # -- Service type
  type: ClusterIP

  # -- Additional annotation
  annotations: {}
    # my-service-annotation: my-service-annotation-value

  # -- Additional service labels
  additionalLabels: {}
  #   additional-label: value-additional-label

  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

ingress:

  # Enable ingress
  enabled: true

  # -- Ingress class name
  className: nginx-internal

  # -- Ingress annotations
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "180"

  # -- Additional ingress labels
  additionalLabels: {}
  #   additional-label: value-additional-label

  # -- Ingress host
  host: generic-app.severstal.com
  paths:
    - path: /
      port: 8080

      # -- You also can change PathType of path. Default template value is Prefix
      # pathType: ImplementationSpecific

  # -- Ingress SSL. Enabled or disabled
  tls: true

