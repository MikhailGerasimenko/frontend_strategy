  #       subPath: index.html
  #     env:
  #     - name: ENV_VAR_NAME
  #       value: "value"
  #     securityContext:
  #       runAsUser: 1000

  # -- Deployment resources
  resources: {}
  #   limits:
  #     memory: 256Mi
  #     cpu: 1
  #   requests:
  #     memory: 128Mi
  #     cpu: 0.1

  # -- Deployment probes
  probes: {}
  #   startupProbe:
  #     tcpSocket:
  #       port: 80
  #     failureThreshold: 10
  #     initialDelaySeconds: 5
  #     periodSeconds: 10
  #   livenessProbe:
  #     tcpSocket:
  #       port: 80
  #     periodSeconds: 30
  #   readinessProbe:
  #     tcpSocket:
  #       port: 80
