# -- String to partially override fullname
nameOverride: ""

# -- String to fully override common.names.fullname
fullnameOverride: ""

global:
  image:
    # -- Global container registry image path
    repository: docker.repo.severstal.severstalgroup.com/nginx

    # -- Global container registry image tag
    tag: 1.13

  # -- Container registry credentials
  imagePullSecrets: "container-registry"

  # -- Image pull policy
  imagePullPolicy: Always

secrets:
  # -- Use external secrets or not
  enabled: true

  # -- Kind of external secret backend
  kind: "ClusterSecretStore"

  # -- External secrets backend name
  backend: "eso-vault-backend"

  # -- Secret path in Vault secret backend
  projectNamespace: ""

  # -- Refresh interval of secret
  refreshInterval: 30m

  # -- Additional annotations
  annotations: {}
    # "helm.sh/hook": pre-install
    # "helm.sh/hook-weight": "-10"

  # -- If `false`, disables providing secrets as env to provide only secrets as files
  env: true

  # -- If `true`, creates a common secret for multiple services usage. Vault path must be projectNamespace/common/env/$env
  common: ""

    # -- Additional annotations to common secret
    # annotations: {}
    #   "helm.sh/hook": pre-install
    #   "helm.sh/hook-weight": "-10"

  # -- Mount secret as file into container
  files: {}
    # - name: krb5.conf
    #   path: /etc/krb5.conf
    # - name: configmap.yaml
    #   path: /etc/configmap.yaml

  # -- Provide ssl certificate with key via ESO
  tls:

    # -- If `true`, *.kube.severstalgroup.severstal.com TLS will be created from `common/tls/` Vault path. If false, TLS must be in `projectNamespace/tls` Vault path
    common: false

    # -- Works only if tls.common is `false`. If exist, overwrite `projectNamespace/tls` to custom Vault path
    customPath: ""

    # -- External secrets backend name for TLS
    backend: "eso-vault-backend"

deployment:

  # image:

  #   # -- Deployment container registry image path. Overwrites global.image.repository parameter
  #   repository: docker.repo.severstal.severstalgroup.com/nginx

  #   # -- Deployment container registry image tag. Overwrites global.image.tag parameter
  #   tag: 1.21

  # -- Deployment image pull policy. Overwrites global.imagepullpolicy
  imagePullPolicy: IfNotPresent

  # -- Number of replicas for deployment
  replicas: 1

  # -- Fixed Environment variable
  env: []
  # - name: DOTNET_CLI_TELEMETRY_OPTOUT
  #   value: "1"
  # - name: DOTNET_USE_POLLING_FILE_WATCHER
  #   value: "1"

  # -- Additional annotations for deployment
  annotations: {}
    # additional-annotation: value-of-additional-annotation

  reloadOnChange:
    # -- Reloads container if configMap or secret changed
    enabled: true

    # -- Reloads the deployment if the specified configmap or secret in the namespace is changed, even if they are not used by the deployment itself
    # configMapOnChange: configmap-1
    # secretOnChange: secret-1

  # -- Additional deployment labels
  additionalLabels: {}
    # additional-label: value-of-my-additional-label

  # -- Additional deployment pod labels
  podLabels: {}
  #   additional-pod-label: value-of-additional-pod-label

  strategy:

    # -- Deployment strategy type
    type: RollingUpdate
    # or
    # type: Recreate

    # -- If strategy.type is `RollingUpdate`
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  # -- Command to run in main container
  command: "" #['sh', '-c', 'binary_package']

  # -- Deployment ports to expose
  ports: []
  # - containerPort: 80
  #   name: http
  #   protocol: TCP
  # - containerPort: 8778

  # -- Deployment host aliases
  hostAliases: []
  # - ip: "10.10.10.10"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.10.10.11"
  #   hostnames:
  #   - "google.ru"
  #   - "yandex.ru"

  # -- Deployment init containers
  initContainers: {}
  #   init-container:
  #     image: docker.repo.severstal.severstalgroup.com/devops-public/corp-images/ubuntu:22.04
  #     command: ['sh', '-c', 'whoami']
  #     resources: {}
  #     volumeMounts:
  #     - name: additional-configmap-file-1
