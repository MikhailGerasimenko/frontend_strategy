fullnameOverride: "$CI_PROJECT_NAME_SLUG"

global:
  image:
    repository: docker.repo.severstal.severstalgroup.com/$CI_PROJECT_PATH
    tag: 1.13

secrets:
  enabled: true
  projectNamespace: "$CI_PROJECT_NAMESPACE"
  backend: "eso-vault-backend"
  files: {}
  tls:
    common: false

deployment:
  replicas: 1
  reloadOnChange:
    enabled: true
  ports:
    - containerPort: 8080
      name: http
      protocol: TCP
  probes:
    startupProbe:
      tcpSocket:
        port: 8080
      failureThreshold: 10
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 30
    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 30

service:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

ingress:
  enabled: true
  className: nginx-internal
  annotations: {}
  host: generic-app.severstal.com
  paths:
    - path: /
      port: 8080
  tls: true