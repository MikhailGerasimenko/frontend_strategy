include:
  - project: '$CI_TEMPLATE_PROJECT'
    file:
      - 'helm/common.yml'

.make_slug_vars: &make_slug_vars
  - export CI_PROJECT_NAME_SLUG=$(echo $CI_PROJECT_NAME| sed 's/\./-/g; s/_/-/g')

variables:
  HELM_PATH: ./
  HELM_REPO: "helm-local-public/sss/generic"

helm:validate:
  stage: test
  rules:
   - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"

helm push:
  extends: .deploy_common
  environment: prod
  dependencies:
    - helm:validate
  before_script:
    - helm package . --version $HELM_CHART_VERSION
    - *make_slug_vars
  script:
    - curl -u$CI_DEPLOY_USER:$CI_DEPLOY_PASSWORD -T ./$CI_PROJECT_NAME_SLUG-$HELM_CHART_VERSION.tgz "https://repo.severstal.severstalgroup.com/artifactory/$HELM_REPO/$CI_PROJECT_NAME_SLUG-$HELM_CHART_VERSION.tgz"
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        HELM_CHART_VERSION: $CI_COMMIT_TAG

